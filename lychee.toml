# Конфигурация проверки ссылок (lychee).
# Исключаем локальные адреса и плейсхолдеры, которые не являются реальными ссылками.

# Пропускать localhost / 127.0.0.1
exclude_loopback = true

# Коды, которые не считаем битой ссылкой (403/429 — сайты, блокирующие ботов)
accept = ["200", "206", "403", "429"]

# Плейсхолдеры и служебные адреса из примеров в документации
exclude = [
  "example\\.com",
  "github\\.com/settings",
  "github\\.com/КОМПАНИЯ",
  "КОМПАНИЯ",
  "РЕПОЗИТОРИЙ",
  "ORG\\.github\\.io",
  "ТВОЙ-ЛОГИН",
]
