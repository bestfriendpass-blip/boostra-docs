<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">10.1 Контекстная UML-схема потока заявки Boostra</title>
  <desc id="desc">Компонентная UML-схема показывает связь каналов заявки, сайта Boostra, CRM, скорингового контура, ПДН, маршрутизатора, платежного контура, допуслуг и витрины событий.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .component { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .service { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .risk { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .artifact { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .sink { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .node-title { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px Arial, sans-serif; fill: #334155; }
      .stereo { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-back { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); stroke-dasharray: 8 6; }
      .label { font: 400 14px Arial, sans-serif; fill: #334155; }
      .port { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="70" y="70">10.1 Контекстная схема</text>
  <text class="subtitle" x="70" y="100">UML component view: системы и контуры, участвующие в прохождении заявки и сборе витрины событий</text>

  <rect class="frame" x="50" y="125" width="1500" height="805" rx="10"/>
  <text class="stereo" x="80" y="160">«system context» Boostra application flow</text>

  <g id="channels">
    <rect class="component" x="95" y="250" width="230" height="95" rx="6"/>
    <rect class="port" x="112" y="267" width="16" height="12"/>
    <rect class="port" x="112" y="284" width="16" height="12"/>
    <text class="stereo" x="145" y="280">«external channels»</text>
    <text class="node-title" x="145" y="310">Каналы заявки</text>
  </g>

  <g id="site">
    <rect class="component" x="405" y="250" width="250" height="95" rx="6"/>
    <rect class="port" x="422" y="267" width="16" height="12"/>
    <rect class="port" x="422" y="284" width="16" height="12"/>
    <text class="stereo" x="455" y="280">«component»</text>
    <text class="node-title" x="455" y="310">Boostra / сайт</text>
  </g>

  <g id="tid">
    <rect class="service" x="405" y="430" width="250" height="95" rx="6"/>
    <text class="stereo" x="455" y="460">«identity service»</text>
    <text class="node-title" x="455" y="490">T-ID / авторизация</text>
    <text class="node-text" x="455" y="515">s_tbank_id, СМЭВ</text>
  </g>

  <g id="crm">
    <rect class="component" x="755" y="250" width="260" height="95" rx="6"/>
    <rect class="port" x="772" y="267" width="16" height="12"/>
    <rect class="port" x="772" y="284" width="16" height="12"/>
    <text class="stereo" x="805" y="280">«core system»</text>
    <text class="node-title" x="805" y="310">CRM</text>
  </g>

  <g id="scoring">
    <rect class="risk" x="1140" y="160" width="285" height="95" rx="6"/>
    <text class="stereo" x="1190" y="190">«decision service»</text>
    <text class="node-title" x="1190" y="220">СПРКА / скоринг</text>
    <text class="node-text" x="1190" y="245">s_scorings</text>
  </g>

  <g id="pdn">
    <rect class="risk" x="1140" y="300" width="285" height="95" rx="6"/>
    <text class="stereo" x="1190" y="330">«regulatory service»</text>
    <text class="node-title" x="1190" y="360">ПДН-сервис</text>
    <text class="node-text" x="1190" y="385">s_pdn_calculation</text>
  </g>

  <g id="router">
    <rect class="risk" x="1140" y="440" width="285" height="95" rx="6"/>
    <text class="stereo" x="1190" y="470">«router»</text>
    <text class="node-title" x="1190" y="500">Маршрутизатор</text>
    <text class="node-text" x="1190" y="525">ручеек, s_order_org_switch</text>
  </g>

  <g id="onec">
    <rect class="service" x="1140" y="580" width="285" height="85" rx="6"/>
    <text class="stereo" x="1190" y="610">«accounting»</text>
    <text class="node-title" x="1190" y="640">1С</text>
  </g>

  <g id="b2p">
    <rect class="service" x="755" y="580" width="260" height="85" rx="6"/>
    <text class="stereo" x="805" y="610">«payment provider»</text>
    <text class="node-title" x="805" y="640">Best2Pay</text>
  </g>

  <g id="addons">
    <rect class="service" x="405" y="580" width="250" height="85" rx="6"/>
    <text class="stereo" x="455" y="610">«service licenses»</text>
    <text class="node-title" x="455" y="640">Допуслуги</text>
  </g>

  <g id="events">
    <rect class="sink" x="755" y="755" width="270" height="105" rx="6"/>
    <text class="stereo" x="805" y="785">«data mart»</text>
    <text class="node-title" x="805" y="815">Витрина событий</text>
    <text class="node-text" x="805" y="842">единый таймлайн заявки</text>
  </g>

  <g id="report">
    <rect class="artifact" x="1140" y="755" width="285" height="105" rx="6"/>
    <text class="stereo" x="1190" y="785">«artifact»</text>
    <text class="node-title" x="1190" y="815">HTML / отчет</text>
    <text class="node-text" x="1190" y="842">для созвона</text>
  </g>

  <path class="edge" d="M 325 298 L 405 298"/>
  <path class="edge" d="M 530 345 L 530 430"/>
  <path class="edge" d="M 655 298 L 755 298"/>
  <path class="edge" d="M 1015 298 C 1065 298 1085 210 1140 210"/>
  <path class="edge" d="M 1015 315 C 1065 315 1085 348 1140 348"/>
  <path class="edge" d="M 1015 330 C 1065 330 1085 488 1140 488"/>
  <path class="edge-back" d="M 1140 520 C 1075 540 1060 360 1015 330"/>
  <path class="edge" d="M 1015 622 L 1140 622"/>
  <path class="edge" d="M 885 345 L 885 580"/>
  <path class="edge" d="M 655 622 L 755 622"/>
  <path class="edge" d="M 885 665 L 885 755"/>
  <path class="edge" d="M 530 525 C 560 710 680 805 755 805"/>
  <path class="edge" d="M 1282 255 C 1282 700 1050 805 1025 805"/>
  <path class="edge" d="M 1282 395 C 1282 710 1050 810 1025 810"/>
  <path class="edge" d="M 1282 535 C 1282 720 1050 815 1025 815"/>
  <path class="edge" d="M 1282 665 C 1282 735 1050 820 1025 820"/>
  <path class="edge" d="M 1015 805 L 1140 805"/>

  <text class="label" x="350" y="285">lead</text>
  <text class="label" x="575" y="395">T-ID</text>
  <text class="label" x="675" y="285">создание</text>
  <text class="label" x="1035" y="192">проверки</text>
  <text class="label" x="1035" y="340">ПДН/МПЛ</text>
  <text class="label" x="1035" y="470">смена МКК</text>
  <text class="label" x="1045" y="610">синхронизация</text>
  <text class="label" x="895" y="555">выдача</text>
  <text class="label" x="685" y="645">лицензии</text>
  <text class="label" x="1045" y="792">публикация</text>
</svg>
