<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">10.3 UML state machine состояний заявки</title>
  <desc id="desc">State machine diagram показывает состояния заявки для отчета: Created, Scoring, Pdn, Router, Approved, Switched, Signed, Issued, Rejected и Error.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .state { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .state-alt { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .terminal { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .done { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .start { fill: #0f172a; }
      .final-outer { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .final-inner { fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1040"/>
  <text class="title" x="60" y="68">10.3 Состояния заявки для отчета</text>
  <text class="subtitle" x="60" y="98">UML state machine: финальные и промежуточные состояния заявки в витрине</text>

  <rect class="frame" x="45" y="125" width="1410" height="855" rx="10"/>

  <circle class="start" cx="105" cy="270" r="16"/>

  <g id="created">
    <rect class="state" x="180" y="230" width="180" height="80" rx="14"/>
    <text class="node-title" x="270" y="263">Created</text>
    <text class="node-text" x="270" y="288">заявка создана</text>
  </g>

  <g id="scoring">
    <rect class="state" x="465" y="230" width="180" height="80" rx="14"/>
    <text class="node-title" x="555" y="263">Scoring</text>
    <text class="node-text" x="555" y="288">проверки СПРКА</text>
  </g>

  <g id="pdn">
    <rect class="state-alt" x="750" y="230" width="180" height="80" rx="14"/>
    <text class="node-title" x="840" y="263">Pdn</text>
    <text class="node-text" x="840" y="288">ПДН / МПЛ</text>
  </g>

  <g id="router">
    <rect class="state-alt" x="750" y="445" width="180" height="80" rx="14"/>
    <text class="node-title" x="840" y="478">Router</text>
    <text class="node-text" x="840" y="503">ручеек</text>
  </g>

  <g id="approved">
    <rect class="done" x="1040" y="230" width="180" height="80" rx="14"/>
    <text class="node-title" x="1130" y="263">Approved</text>
    <text class="node-text" x="1130" y="288">одобрено</text>
  </g>

  <g id="switched">
    <rect class="state-alt" x="1040" y="445" width="180" height="80" rx="14"/>
    <text class="node-title" x="1130" y="478">Switched</text>
    <text class="node-text" x="1130" y="503">смена МКК</text>
  </g>

  <g id="signed">
    <rect class="done" x="1040" y="635" width="180" height="80" rx="14"/>
    <text class="node-title" x="1130" y="668">Signed</text>
    <text class="node-text" x="1130" y="693">подписано</text>
  </g>

  <g id="issued">
    <rect class="done" x="1040" y="805" width="180" height="80" rx="14"/>
    <text class="node-title" x="1130" y="838">Issued</text>
    <text class="node-text" x="1130" y="863">выдано</text>
  </g>

  <g id="rejected">
    <rect class="terminal" x="465" y="635" width="180" height="80" rx="14"/>
    <text class="node-title" x="555" y="668">Rejected</text>
    <text class="node-text" x="555" y="693">бизнес-отказ</text>
  </g>

  <g id="error">
    <rect class="terminal" x="180" y="635" width="180" height="80" rx="14"/>
    <text class="node-title" x="270" y="668">Error</text>
    <text class="node-text" x="270" y="693">тех. ошибка</text>
  </g>

  <circle class="final-outer" cx="1340" cy="675" r="22"/>
  <circle class="final-inner" cx="1340" cy="675" r="11"/>

  <path class="edge" d="M 121 270 L 180 270"/>
  <path class="edge" d="M 360 270 L 465 270"/>
  <path class="edge" d="M 645 270 L 750 270"/>
  <path class="edge" d="M 930 270 L 1040 270"/>
  <path class="edge" d="M 840 310 L 840 445"/>
  <path class="edge" d="M 930 485 L 1040 485"/>
  <path class="edge-dash" d="M 1130 525 C 1130 585 980 595 930 520 C 900 475 955 330 1040 285"/>
  <path class="edge" d="M 1130 310 L 1130 635"/>
  <path class="edge" d="M 1130 715 L 1130 805"/>
  <path class="edge" d="M 1220 675 L 1318 675"/>
  <path class="edge" d="M 1220 845 C 1300 845 1340 780 1340 697"/>
  <path class="edge" d="M 555 310 C 555 455 555 535 555 635"/>
  <path class="edge" d="M 465 675 L 360 675"/>
  <path class="edge" d="M 270 310 C 270 440 270 535 270 635"/>
  <path class="edge" d="M 750 270 C 650 350 640 555 645 665"/>
  <path class="edge" d="M 750 485 C 660 505 640 600 645 675"/>
  <path class="edge" d="M 360 675 L 465 675"/>
  <path class="edge" d="M 645 675 C 760 750 1050 760 1318 685"/>
  <path class="edge" d="M 270 715 C 420 915 1160 930 1325 690"/>

  <text class="label" x="380" y="255">Created → Scoring</text>
  <text class="label" x="665" y="255">success</text>
  <text class="label" x="950" y="255">within MPL</text>
  <text class="label" x="855" y="385">not within MPL</text>
  <text class="label" x="955" y="470">child order</text>
  <text class="label" x="1145" y="455">base org</text>
  <text class="label" x="1145" y="590">signed</text>
  <text class="label" x="1145" y="775">issued</text>
  <text class="label" x="575" y="470">stop factor</text>
  <text class="label" x="315" y="470">scoring / PDN / router error</text>
  <text class="label" x="660" y="650">no route</text>
</svg>
