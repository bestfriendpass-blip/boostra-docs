<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">10.2 UML activity flow прохождения заявки</title>
  <desc id="desc">Activity diagram показывает путь заявки от создания через скоринг, ПДН, маршрутизатор, одобрение, подписание и выдачу, включая ветки отказов и ошибок.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #334155; }
      .action { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .stop { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .success { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .start { fill: #0f172a; }
      .final-outer { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .final-inner { fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1120"/>
  <text class="title" x="60" y="68">10.2 Поток заявки</text>
  <text class="subtitle" x="60" y="98">UML activity diagram: основной путь, отказные и ошибочные ветки</text>

  <rect class="frame" x="45" y="125" width="1410" height="930" rx="10"/>
  <rect class="lane" x="70" y="155" width="315" height="870" rx="8"/>
  <rect class="lane" x="405" y="155" width="315" height="870" rx="8"/>
  <rect class="lane" x="740" y="155" width="315" height="870" rx="8"/>
  <rect class="lane" x="1075" y="155" width="355" height="870" rx="8"/>
  <text class="lane-title" x="95" y="190">Boostra / CRM</text>
  <text class="lane-title" x="430" y="190">СПРКА</text>
  <text class="lane-title" x="765" y="190">ПДН / ручеек</text>
  <text class="lane-title" x="1100" y="190">Финальный исход</text>

  <circle class="start" cx="225" cy="245" r="16"/>

  <g id="created">
    <rect class="action" x="115" y="295" width="220" height="70" rx="22"/>
    <text class="node-title" x="225" y="325">Заявка создана</text>
    <text class="node-text" x="225" y="348">s_orders.date</text>
  </g>

  <g id="scoring">
    <rect class="action" x="455" y="295" width="220" height="70" rx="22"/>
    <text class="node-title" x="565" y="325">Скоринги</text>
    <text class="node-text" x="565" y="348">s_scorings</text>
  </g>

  <g id="score-decision">
    <polygon class="decision" points="565,425 675,495 565,565 455,495"/>
    <text class="node-title" x="565" y="492">Результат</text>
    <text class="node-text" x="565" y="515">скоринга</text>
  </g>

  <g id="pdn">
    <rect class="action" x="785" y="295" width="220" height="70" rx="22"/>
    <text class="node-title" x="895" y="325">ПДН / МПЛ</text>
    <text class="node-text" x="895" y="348">s_pdn_calculation</text>
  </g>

  <g id="pdn-decision">
    <polygon class="decision" points="895,425 1015,495 895,565 775,495"/>
    <text class="node-title" x="895" y="492">Лимит</text>
    <text class="node-text" x="895" y="515">пройден?</text>
  </g>

  <g id="router">
    <rect class="action" x="785" y="640" width="220" height="70" rx="22"/>
    <text class="node-title" x="895" y="670">Маршрутизатор</text>
    <text class="node-text" x="895" y="693">ручеек / МКК</text>
  </g>

  <g id="router-decision">
    <polygon class="decision" points="895,765 1015,835 895,905 775,835"/>
    <text class="node-title" x="895" y="832">Вариант</text>
    <text class="node-text" x="895" y="855">выдачи</text>
  </g>

  <g id="child">
    <rect class="action" x="1115" y="665" width="230" height="70" rx="22"/>
    <text class="node-title" x="1230" y="695">Дочерняя заявка</text>
    <text class="node-text" x="1230" y="718">смена МКК</text>
  </g>

  <g id="approved">
    <rect class="success" x="1115" y="295" width="230" height="70" rx="22"/>
    <text class="node-title" x="1230" y="325">Одобрение</text>
    <text class="node-text" x="1230" y="348">approve_date / status 2</text>
  </g>

  <g id="signed">
    <rect class="success" x="1115" y="445" width="230" height="70" rx="22"/>
    <text class="node-title" x="1230" y="475">Подписание</text>
    <text class="node-text" x="1230" y="498">accept_date</text>
  </g>

  <g id="issued">
    <rect class="success" x="1115" y="595" width="230" height="70" rx="22"/>
    <text class="node-title" x="1230" y="625">Выдача денег</text>
    <text class="node-text" x="1230" y="648">Best2Pay / status 10</text>
  </g>

  <g id="reject-score">
    <rect class="stop" x="115" y="585" width="220" height="70" rx="22"/>
    <text class="node-title" x="225" y="615">Отказ скоринга</text>
    <text class="node-text" x="225" y="638">stop factor</text>
  </g>

  <g id="error-score">
    <rect class="stop" x="455" y="705" width="220" height="70" rx="22"/>
    <text class="node-title" x="565" y="735">Ошибка скоринга</text>
    <text class="node-text" x="565" y="758">status ERROR</text>
  </g>

  <g id="error-pdn">
    <rect class="stop" x="1115" y="825" width="230" height="70" rx="22"/>
    <text class="node-title" x="1230" y="855">Ошибка ПДН</text>
    <text class="node-text" x="1230" y="878">success = 0</text>
  </g>

  <g id="reject-router">
    <rect class="stop" x="455" y="925" width="220" height="70" rx="22"/>
    <text class="node-title" x="565" y="955">Отказ ручейка</text>
    <text class="node-text" x="565" y="978">нет варианта</text>
  </g>

  <circle class="final-outer" cx="1230" cy="970" r="20"/>
  <circle class="final-inner" cx="1230" cy="970" r="10"/>

  <path class="edge" d="M 225 261 L 225 295"/>
  <path class="edge" d="M 335 330 L 455 330"/>
  <path class="edge" d="M 565 365 L 565 425"/>
  <path class="edge" d="M 675 495 C 725 495 735 330 785 330"/>
  <path class="edge" d="M 895 365 L 895 425"/>
  <path class="edge" d="M 1015 495 C 1060 495 1070 330 1115 330"/>
  <path class="edge" d="M 895 565 L 895 640"/>
  <path class="edge" d="M 895 710 L 895 765"/>
  <path class="edge" d="M 1015 835 C 1055 835 1075 700 1115 700"/>
  <path class="edge" d="M 1230 665 L 1230 735"/>
  <path class="edge-dash" d="M 1115 700 C 1045 700 1045 330 1115 330"/>
  <path class="edge" d="M 1230 365 L 1230 445"/>
  <path class="edge" d="M 1230 515 L 1230 595"/>
  <path class="edge" d="M 1230 665 L 1230 950"/>
  <path class="edge" d="M 455 495 C 365 495 350 620 335 620"/>
  <path class="edge" d="M 565 565 L 565 705"/>
  <path class="edge" d="M 775 495 C 725 495 715 740 675 740"/>
  <path class="edge" d="M 1015 495 C 1080 505 1090 860 1115 860"/>
  <path class="edge" d="M 775 835 C 705 850 705 960 675 960"/>

  <text class="label" x="700" y="470">успех</text>
  <text class="label" x="1042" y="470">вошли в лимит</text>
  <text class="label" x="910" y="606">не вошли в лимит</text>
  <text class="label" x="1030" y="775">сменить МКК</text>
  <text class="label" x="1015" y="318">выдать на базовой</text>
  <text class="label" x="385" y="570">отказ</text>
  <text class="label" x="582" y="685">ошибка</text>
  <text class="label" x="1075" y="805">ошибка</text>
  <text class="label" x="705" y="910">нет варианта</text>
</svg>
